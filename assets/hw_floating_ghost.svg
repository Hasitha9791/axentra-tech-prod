<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140" fill="none">
  <defs>
    <filter id="ghostGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="ghostBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#e0f2fe" stop-opacity="0.88" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="ghostAura" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#9d4edd" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3c096c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Glowing Ghost Ambient Aura -->
  <ellipse cx="60" cy="55" rx="45" ry="50" fill="url(#ghostAura)" />

  <g filter="url(#ghostGlow)">
    <!-- Ghost Body with Flowing Billowing Tail -->
    <path d="M 60 15 
             C 35 15, 25 35, 25 60
             C 25 80, 20 100, 28 115
             C 32 122, 40 115, 45 110
             C 50 105, 55 125, 62 120
             C 68 115, 72 108, 78 118
             C 84 125, 92 110, 95 95
             C 98 75, 95 35, 60 15 Z" 
          fill="url(#ghostBodyGrad)" stroke="#c4b5fd" stroke-width="1.8" />

    <!-- Cute Ghost Little Floating Arms -->
    <!-- Left Hand -->
    <path d="M 28 55 C 15 58, 12 70, 20 74 C 26 77, 30 68, 28 55 Z" fill="#ffffff" opacity="0.9" />
    <!-- Right Hand -->
    <path d="M 92 55 C 105 58, 108 70, 100 74 C 94 77, 90 68, 92 55 Z" fill="#ffffff" opacity="0.9" />

    <!-- Large Expressive Cute Eyes -->
    <ellipse cx="48" cy="45" rx="5.5" ry="8" fill="#1e1035" />
    <circle cx="46" cy="42" r="2.2" fill="#ffffff" />
    <circle cx="50" cy="48" r="1.1" fill="#ffffff" />

    <ellipse cx="72" cy="45" rx="5.5" ry="8" fill="#1e1035" />
    <circle cx="70" cy="42" r="2.2" fill="#ffffff" />
    <circle cx="74" cy="48" r="1.1" fill="#ffffff" />

    <!-- Cute Rosy Ghost Cheeks (Glowing Pink/Orange) -->
    <ellipse cx="40" cy="55" rx="4" ry="2.5" fill="#ff70a6" opacity="0.6" />
    <ellipse cx="80" cy="55" rx="4" ry="2.5" fill="#ff70a6" opacity="0.6" />

    <!-- Happy Little 'O' Mouth -->
    <ellipse cx="60" cy="56" rx="3.5" ry="5" fill="#1e1035" />
  </g>

  <!-- Floating Magic Sparkles -->
  <polygon points="20,30 22,24 28,26 24,30 26,36 21,32 16,35 18,29" fill="#ffd166" opacity="0.8" />
  <polygon points="100,35 102,30 107,31 104,35 106,40 101,37 97,39 98,34" fill="#00f5d4" opacity="0.8" />
</svg>
