<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <!-- Mirrored Top-Right Web with Roosting Cyber Bat -->
  <defs>
    <filter id="webGlowR" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="webGradR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffbe0b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <g transform="translate(240, 0) scale(-1, 1)">
    <g filter="url(#webGlowR)">
      <line x1="0" y1="0" x2="230" y2="20" stroke="url(#webGradR)" stroke-width="1.8" />
      <line x1="0" y1="0" x2="210" y2="60" stroke="url(#webGradR)" stroke-width="1.8" />
      <line x1="0" y1="0" x2="180" y2="110" stroke="url(#webGradR)" stroke-width="1.8" />
      <line x1="0" y1="0" x2="140" y2="160" stroke="url(#webGradR)" stroke-width="1.8" />
      <line x1="0" y1="0" x2="90" y2="200" stroke="url(#webGradR)" stroke-width="1.8" />
      <line x1="0" y1="0" x2="35" y2="230" stroke="url(#webGradR)" stroke-width="1.8" />
      <line x1="0" y1="0" x2="0" y2="240" stroke="url(#webGradR)" stroke-width="1.8" />

      <path d="M 0 35 Q 22 24 35 0" stroke="url(#webGradR)" stroke-width="1.2" fill="none" />
      <path d="M 0 70 Q 25 58 48 52 Q 62 30 70 0" stroke="url(#webGradR)" stroke-width="1.3" fill="none" />
      <path d="M 0 110 Q 32 94 68 85 Q 98 75 110 0" stroke="url(#webGradR)" stroke-width="1.4" fill="none" />
      <path d="M 0 155 Q 40 135 90 120 Q 130 102 155 0" stroke="url(#webGradR)" stroke-width="1.5" fill="none" />
      <path d="M 0 200 Q 55 175 118 152 Q 168 128 200 0" stroke="url(#webGradR)" stroke-width="1.6" fill="none" />
      <path d="M 15 235 Q 75 210 148 180 Q 205 145 235 15" stroke="url(#webGradR)" stroke-width="1.7" fill="none" />

      <circle cx="68" cy="85" r="2.5" fill="#ffffff" opacity="0.9" />
      <circle cx="118" cy="152" r="3" fill="#ffbe0b" opacity="0.8" />
      <circle cx="90" cy="120" r="2" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Dangling Little Jack-o-Lantern Charm -->
    <line x1="118" y1="152" x2="118" y2="200" stroke="#ffbe0b" stroke-width="1.2" stroke-dasharray="2,2" />
    <g transform="translate(118, 212)">
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="#ff7a00" stroke="#ffbe0b" stroke-width="1.2" />
      <ellipse cx="-5" cy="0" rx="7" ry="11" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
      <ellipse cx="5" cy="0" rx="7" ry="11" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1" />
      <!-- Stem -->
      <path d="M -1 -12 Q 1 -16 4 -17 Q 3 -13 1 -12 Z" fill="#2d6a4f" />
      <!-- Glowing Eyes -->
      <polygon points="-5,-3 -2,-1 -5,1" fill="#fff3b0" />
      <polygon points="5,-3 2,-1 5,1" fill="#fff3b0" />
      <!-- Glowing Smile -->
      <path d="M -7 4 Q 0 9 7 4 Q 4 6 0 6 Q -4 6 -7 4 Z" fill="#fff3b0" />
    </g>
  </g>
</svg>
