<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110" fill="none">
  <defs>
    <filter id="floatPumpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="floatPumpGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="60%" stop-color="#ff7a00" />
      <stop offset="90%" stop-color="#d00000" />
      <stop offset="100%" stop-color="#370617" />
    </radialGradient>
  </defs>

  <g filter="url(#floatPumpGlow)">
    <!-- Floating Stem -->
    <path d="M 48 18 C 50 10 56 8 58 6 C 56 12 53 16 51 18 Z" fill="#2d6a4f" />
    <!-- Pumpkin Shell -->
    <ellipse cx="50" cy="48" rx="36" ry="30" fill="url(#floatPumpGrad)" />
    <!-- Ribs -->
    <ellipse cx="34" cy="48" rx="18" ry="28" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1.8" />
    <ellipse cx="66" cy="48" rx="18" ry="28" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1.8" />

    <!-- Glowing Carved Face -->
    <polygon points="38,40 45,42 41,47" fill="#fff3b0" />
    <polygon points="62,40 55,42 59,47" fill="#fff3b0" />
    <polygon points="50,46 47,50 53,50" fill="#fff3b0" />
    <!-- Happy Wicked Smile -->
    <path d="M 36 56 Q 50 68 64 56 Q 57 61 50 61 Q 43 61 36 56 Z" fill="#fff3b0" />

    <!-- Vaporous Floating Smoke Wisp Below -->
    <path d="M 45 80 Q 40 95 48 105" stroke="#9d4edd" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M 54 82 Q 62 94 56 108" stroke="#ff7a00" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
