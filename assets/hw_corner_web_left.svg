<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" fill="none">
  <defs>
    <filter id="webGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="webGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#ffbe0b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.3" />
    </linearGradient>
    <radialGradient id="spiderGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbe0b" />
      <stop offset="80%" stop-color="#ff5400" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </radialGradient>
  </defs>

  <g filter="url(#webGlow)">
    <!-- Radial structural web rays from corner (0,0) -->
    <line x1="0" y1="0" x2="230" y2="20" stroke="url(#webGrad)" stroke-width="1.8" />
    <line x1="0" y1="0" x2="210" y2="60" stroke="url(#webGrad)" stroke-width="1.8" />
    <line x1="0" y1="0" x2="180" y2="110" stroke="url(#webGrad)" stroke-width="1.8" />
    <line x1="0" y1="0" x2="140" y2="160" stroke="url(#webGrad)" stroke-width="1.8" />
    <line x1="0" y1="0" x2="90" y2="200" stroke="url(#webGrad)" stroke-width="1.8" />
    <line x1="0" y1="0" x2="35" y2="230" stroke="url(#webGrad)" stroke-width="1.8" />
    <line x1="0" y1="0" x2="0" y2="240" stroke="url(#webGrad)" stroke-width="1.8" />

    <!-- Concentric Web Rings (Arched) -->
    <!-- Ring 1 -->
    <path d="M 0 35 Q 22 24 35 0" stroke="url(#webGrad)" stroke-width="1.2" fill="none" />
    <!-- Ring 2 -->
    <path d="M 0 70 Q 25 58 48 52 Q 62 30 70 0" stroke="url(#webGrad)" stroke-width="1.3" fill="none" />
    <!-- Ring 3 -->
    <path d="M 0 110 Q 32 94 68 85 Q 98 75 110 0" stroke="url(#webGrad)" stroke-width="1.4" fill="none" />
    <!-- Ring 4 -->
    <path d="M 0 155 Q 40 135 90 120 Q 130 102 155 0" stroke="url(#webGrad)" stroke-width="1.5" fill="none" />
    <!-- Ring 5 -->
    <path d="M 0 200 Q 55 175 118 152 Q 168 128 200 0" stroke="url(#webGrad)" stroke-width="1.6" fill="none" />
    <!-- Ring 6 Outer -->
    <path d="M 15 235 Q 75 210 148 180 Q 205 145 235 15" stroke="url(#webGrad)" stroke-width="1.7" fill="none" />

    <!-- Dew Drops on Web -->
    <circle cx="68" cy="85" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="118" cy="152" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="90" cy="120" r="2" fill="#ffbe0b" opacity="0.9" />
    <circle cx="140" cy="160" r="2.5" fill="#ffbe0b" opacity="0.85" />
    <circle cx="48" cy="52" r="2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Hanging Spider Silk Thread -->
  <line x1="140" y1="160" x2="140" y2="215" stroke="#ffbe0b" stroke-width="1.2" stroke-dasharray="3,1" />

  <!-- Dangling Glowing Cyber Spider -->
  <g transform="translate(140, 222)">
    <!-- Spider Legs -->
    <g stroke="#ff7a00" stroke-width="1.5" stroke-linecap="round" fill="none">
      <!-- Left Legs -->
      <path d="M -2 -1 Q -12 -8 -16 -2" />
      <path d="M -3 1 Q -14 -2 -18 7" />
      <path d="M -3 3 Q -15 8 -16 16" />
      <path d="M -2 5 Q -10 14 -12 20" />
      <!-- Right Legs -->
      <path d="M 2 -1 Q 12 -8 16 -2" />
      <path d="M 3 1 Q 14 -2 18 7" />
      <path d="M 3 3 Q 15 8 16 16" />
      <path d="M 2 5 Q 10 14 12 20" />
    </g>

    <!-- Spider Abdomen -->
    <ellipse cx="0" cy="8" rx="6" ry="8" fill="url(#spiderGlow)" />
    <!-- Spider Cephalothorax (Head) -->
    <circle cx="0" cy="0" r="4.5" fill="#18042b" stroke="#ff7a00" stroke-width="1" />
    <!-- Glowing Red/Amber Eyes -->
    <circle cx="-1.5" cy="-1" r="1" fill="#ff0054" />
    <circle cx="1.5" cy="-1" r="1" fill="#ff0054" />
    <circle cx="-2.5" cy="0.8" r="0.8" fill="#ffbe0b" />
    <circle cx="2.5" cy="0.8" r="0.8" fill="#ffbe0b" />
    <!-- Abdomen Cyber Rune -->
    <path d="M -2 6 L 2 6 M 0 4 L 0 12" stroke="#ffbe0b" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
