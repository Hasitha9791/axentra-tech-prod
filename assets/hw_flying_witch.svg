<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 110" width="180" height="110" fill="none">
  <defs>
    <filter id="witchGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="broomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="50%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>
  </defs>

  <g filter="url(#witchGlow)">
    <!-- Magic Sparkle Trail from Broom Bristles -->
    <circle cx="160" cy="85" r="2.5" fill="#ffbe0b" opacity="0.9" />
    <circle cx="170" cy="92" r="1.8" fill="#ff7a00" opacity="0.8" />
    <circle cx="150" cy="95" r="3" fill="#c77dff" opacity="0.8" />
    <circle cx="140" cy="100" r="1.5" fill="#00f5d4" opacity="0.75" />
    <circle cx="175" cy="80" r="2" fill="#ffbe0b" opacity="0.65" />

    <!-- Broom Handle -->
    <path d="M 20 30 L 150 85" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round" />
    <path d="M 20 30 L 150 85" stroke="#ffbe0b" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- Broom Bristles -->
    <path d="M 140 80 Q 170 95 178 88 Q 165 105 135 84 Z" fill="#d4a373" stroke="#ff7a00" stroke-width="1.2" />
    <line x1="145" y1="83" x2="170" y2="92" stroke="#6f4e37" stroke-width="1" />
    <line x1="140" y1="84" x2="162" y2="97" stroke="#6f4e37" stroke-width="1" />

    <!-- Witch Flowing Cape / Cloak -->
    <path d="M 65 35 
             C 50 45, 30 65, 15 62
             C 25 72, 50 68, 65 65
             C 75 75, 85 70, 95 68
             C 88 55, 80 45, 65 35 Z" 
          fill="#1c053a" stroke="#9d4edd" stroke-width="1.8" />

    <!-- Witch Body & Dress -->
    <path d="M 65 38 L 85 70 L 68 70 Z" fill="#240046" stroke="#ff7a00" stroke-width="1.2" />

    <!-- Witch Head & Face Silhouette -->
    <circle cx="75" cy="28" r="9" fill="#120422" stroke="#ff7a00" stroke-width="1.2" />
    <!-- Pointed Witch Nose -->
    <polygon points="68,26 62,28 68,30" fill="#120422" />
    <!-- Flowing Hair -->
    <path d="M 76 22 Q 92 30 88 45 Q 82 36 78 30 Z" fill="#ff7a00" opacity="0.9" />

    <!-- Pointed Witch Hat -->
    <ellipse cx="73" cy="22" rx="16" ry="4" fill="#3a0ca3" stroke="#ffbe0b" stroke-width="1.2" />
    <path d="M 64 21 Q 72 0 85 -2 Q 78 12 80 21 Z" fill="#240046" stroke="#ffbe0b" stroke-width="1.2" />
    <!-- Hat Ribbon & Gold Buckle -->
    <path d="M 68 18 Q 74 19 80 18" stroke="#ff7a00" stroke-width="2.5" />
    <rect x="72" y="16.5" width="4" height="3.5" fill="#ffbe0b" rx="0.5" />

    <!-- Little Black Cat Passenger on Back of Broom -->
    <ellipse cx="115" cy="68" rx="8" ry="6" fill="#0d021a" stroke="#ff7a00" stroke-width="1" />
    <circle cx="110" cy="64" r="5" fill="#0d021a" stroke="#ff7a00" stroke-width="1" />
    <polygon points="107,61 106,56 109,60" fill="#ff7a00" />
    <polygon points="112,61 114,56 111,60" fill="#ff7a00" />
    <!-- Cat Glowing Eyes -->
    <circle cx="108" cy="64" r="0.9" fill="#00ff88" />
    <circle cx="111" cy="64" r="0.9" fill="#00ff88" />
    <!-- Cat Curled Tail -->
    <path d="M 122 70 Q 132 68 130 60" stroke="#ff7a00" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>
</svg>
